  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#050816">

  <!-- Tema antes da primeira pintura (sem flash) + classe js para os reveals -->
  <script>
    (function () {
      var d = document.documentElement, t;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      d.dataset.theme = t;
      d.classList.add('js');
      requestAnimationFrame(function () { requestAnimationFrame(function () { d.classList.add('theme-ready'); }); });
    })();
  </script>
